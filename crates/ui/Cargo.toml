[package]
name = "agnoperiph"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agnoperiph"
path = "src/lib.rs"

[[bin]]
name = "agnoperiph"
path = "src/main.rs"

[dependencies]
agnoperiph-core = { workspace = true }
agnoperiph-driver-atk = { workspace = true }
agnoperiph-driver-lamzu = { workspace = true }
agnoperiph-driver-logitech = { workspace = true }
agnoperiph-transport = { workspace = true }
gpui-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tray-icon = { workspace = true }
winreg = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# Test-only: gpui-pre wires no headless renderer on Windows, so screenshot tests
# (tests/visual.rs) supply the wgpu one directly. Pinned to the gpui-pre version gpui-kit uses.
gpui-pre-wgpu = { version = "=0.3.14", features = ["test-support"] }
anyhow = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
