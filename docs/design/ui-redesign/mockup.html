<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgnoPeriph redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Saira:wdth,wght@75..125,400..700&display=swap">
<style>
html,body{margin:0}
.stage{position:relative;width:100%;overflow:hidden}

.win{
  position:absolute;top:0;left:0;width:1240px;height:820px;transform-origin:0 0;
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);
  font-family:'Figtree',system-ui,sans-serif;font-size:13.5px;line-height:1.4;
  -webkit-font-smoothing:antialiased;box-shadow:0 0 0 1px var(--frame);
}
.win.shot{border-radius:0;box-shadow:none}
.win *{box-sizing:border-box}
.win button{font:inherit;color:inherit;cursor:default}
.win p{margin:0}

.win[data-theme=dark]{
  --bg:#15171c;--chrome:#111317;--side:#191c21;--panel:#1d2026;--raised:#262a31;--hover:#2d3139;--popover:#23272e;
  --line:#272b32;--line-strong:#383d46;--tick:#3d424b;
  --fg:#e8eaee;--muted:#969daa;--faint:#6a717d;
  --accent:#47b4ff;--accent-ink:#04121f;--accent-soft:rgba(71,180,255,.13);
  --case:#0e1013;--case-hi:rgba(255,255,255,.05);--case-shadow:rgba(0,0,0,.7);--lip-fg:#7b828e;
  --key-skirt:#1b1e24;--key-face:#2a2e36;--key-face-hi:#323741;--key-hi:rgba(255,255,255,.06);
  --key-legend:#e2e5ea;--key-sub:#8a919d;--key-track:rgba(255,255,255,.07);
  --thumb:#eef0f3;--switch-off:#3a3f48;--warn:#ff8a3d;--danger:#ff7a7a;--frame:rgba(255,255,255,.07);
  --shadow:0 18px 40px -14px rgba(0,0,0,.75);
}
.win[data-theme=light]{
  --bg:#eceef2;--chrome:#f7f8fa;--side:#f4f5f8;--panel:#ffffff;--raised:#e1e4ea;--hover:#d7dbe2;--popover:#ffffff;
  --line:#dde0e6;--line-strong:#c8cdd5;--tick:#b4bac4;
  --fg:#16181d;--muted:#5b6270;--faint:#7c8390;
  --accent:#0067b3;--accent-ink:#ffffff;--accent-soft:rgba(0,103,179,.11);
  --case:#cfd4dc;--case-hi:rgba(255,255,255,.7);--case-shadow:rgba(30,40,60,.35);--lip-fg:#4f5664;
  --key-skirt:#d6dae1;--key-face:#ffffff;--key-face-hi:#f6f7f9;--key-hi:rgba(255,255,255,.9);
  --key-legend:#1b1e24;--key-sub:#6b7280;--key-track:rgba(0,0,0,.07);
  --thumb:#ffffff;--switch-off:#c5cad3;--warn:#a84a00;--danger:#cf3434;--frame:rgba(0,0,0,.14);
  --shadow:0 18px 40px -14px rgba(30,40,60,.35);
}

.sa{font-family:'Saira',sans-serif}
.sp{flex:1}

/* title bar */
.tb{height:40px;flex:none;display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--line);padding-left:12px}
.tb .logo{width:20px;height:20px;border-radius:5px;display:block}
.tb .app{font-family:'Saira';font-weight:600;font-size:15px;margin-left:9px;letter-spacing:.01em}
.tb .count{color:var(--muted);font-size:12.5px;margin-left:12px}
.tbtn{height:28px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12.5px;font-weight:500}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tsep{width:1px;height:18px;background:var(--line-strong);margin:0 6px 0 8px}
.wc{width:46px;height:40px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted)}
.wc:hover{background:var(--hover);color:var(--fg)}
.wc.close:hover{background:#c42b1c;color:#fff}

/* shell */
.shell{flex:1;display:flex;min-height:0}
.side{width:264px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px}
.side-lbl{color:var(--muted);font-size:12px;font-weight:600;padding:0 10px 8px}
.devs{display:flex;flex-direction:column;gap:2px}
.dev{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:9px;background:transparent}
.dev:hover{background:var(--hover)}
.dev.on{background:var(--raised)}
.dev .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--panel);color:var(--muted)}
.dev.on .ico{color:var(--accent)}
.dtx{min-width:0;display:block}
.dev .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .meta{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin-top:1px}
.dev .bt{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.bt.low{color:var(--warn)}
.side-foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav.on{background:var(--raised);color:var(--fg);font-weight:600}
.nav-meta{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}

.mainwrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.main{flex:1;min-height:0;overflow:auto;padding:18px 24px 16px}
.main::-webkit-scrollbar{width:12px}
.main::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:12px;border:4px solid var(--bg)}

/* controls */
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid transparent;background:var(--raised);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.btn:hover{background:var(--hover)}
.btn.sm{height:26px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn.outline{background:transparent;border-color:var(--line-strong)}
.btn.outline:hover{background:var(--raised)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.4;pointer-events:none}
.win button:focus-visible,.win [tabindex]:focus-visible,.win input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{display:inline-flex;background:var(--raised);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg button{height:26px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--fg);background:var(--hover)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.sm button{height:24px;padding:0 9px;font-size:12.5px}

.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--raised);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}

.sw{width:34px;height:20px;border-radius:999px;background:var(--switch-off);position:relative;border:0;padding:0;flex:none;transition:background-color .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(14px)}

.stp{display:inline-flex;align-items:center;gap:2px;background:var(--raised);border-radius:7px;padding:2px;height:28px;flex:none}
.sbtn{width:24px;height:24px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.sbtn:hover{background:var(--hover);color:var(--fg)}
.snum{min-width:62px;text-align:center;font-family:'Saira';font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.snum small{font-family:'Figtree';font-weight:500;font-size:11.5px;color:var(--muted);margin-left:2px}
.stp.xs .snum{min-width:40px}
.sbtn.lg{width:30px;height:30px;background:var(--raised);border-radius:7px;font-size:18px}

.rng{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;display:block;--p:0%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) 0 var(--p),var(--raised) var(--p) 100%)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--thumb);border:2px solid var(--accent);margin-top:-6px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.rng::-moz-range-track{height:4px;border-radius:4px;background:var(--raised)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
.rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--thumb);border:2px solid var(--accent)}
.rng:disabled{opacity:.35}
.rng:focus-visible{outline:none}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 2px var(--accent)}

/* page header */
.dhead{display:flex;align-items:center;gap:14px;min-height:34px}
.dhead h1{font-family:'Saira';font-weight:600;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.005em;white-space:nowrap}
.prow{display:flex;align-items:center;gap:10px;margin-top:12px}
.plabel{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:24px;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:0 0 10px;color:var(--muted);font-weight:500;position:relative}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);font-weight:600}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.tabbody{margin-top:14px}

/* panels */
.panel{background:var(--panel);border-radius:12px;padding:14px 16px 16px;position:relative}
.phead{display:flex;align-items:center;gap:8px;min-height:26px;margin-bottom:10px}
.ptitle{font-family:'Saira';font-weight:650;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-stretch:115%;white-space:nowrap}
.pnote{color:var(--muted);font-size:12px}
.pdesc{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.ph{display:grid;place-items:center;min-height:240px;color:var(--muted);text-align:center}

/* keyboard */
.brow{display:flex;gap:16px;align-items:stretch}
.bcol{width:656px;flex:none}
.case{background:var(--case);border-radius:14px;padding:10px 8px 0;box-shadow:inset 0 1px 0 var(--case-hi),0 16px 30px -18px var(--case-shadow)}
.plate{position:relative;width:640px;height:246px}
.lip{display:flex;align-items:center;gap:16px;height:30px;padding:0 6px;color:var(--lip-fg);font-size:11.5px;white-space:nowrap}
.lg-i{display:inline-flex;align-items:center;gap:6px}
.g-bar{width:14px;height:2px;border-radius:2px;background:currentColor;display:inline-block}
.g-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block}
.lip svg{width:10px;height:10px}

.key{position:absolute;height:37px;padding:1px 2px 4px;border:0;border-radius:6px;background:var(--key-skirt);display:block}
.key .face{position:relative;display:block;height:100%;border-radius:5px;background:var(--key-face);box-shadow:inset 0 1px 0 var(--key-hi);overflow:hidden;transition:background-color .12s}
.key:hover .face{background:var(--key-face-hi)}
.key .lg{position:absolute;left:5px;top:4px;font-family:'Saira';font-weight:600;font-size:11px;line-height:1;font-stretch:92%;color:var(--key-legend);white-space:nowrap}
.key .val{position:absolute;left:5px;bottom:7px;font-family:'Saira';font-weight:600;font-size:10.5px;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.key .bar{position:absolute;left:5px;right:5px;bottom:3px;height:2px;border-radius:2px;background:var(--key-track)}
.key .bar i{display:block;height:100%;border-radius:2px;background:var(--key-sub);opacity:.45}
.key.diff .bar i{background:var(--fg);opacity:.85}
.key .tr{position:absolute;right:4px;top:4px;display:flex;align-items:center;gap:3px;height:10px}
.key .rt{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.key .pair{color:var(--muted);display:flex}
.key .pair svg{width:9px;height:9px}
.win .key.pending{background:var(--warn)}
.g-pend{width:14px;height:4px;border-radius:2px;background:var(--warn);display:inline-block}
.key .depth{position:absolute;left:0;right:0;top:0;background:var(--accent);opacity:.3}
.key.sel{background:color-mix(in srgb,var(--accent) 55%,var(--key-skirt))}
.key.sel .face{background:color-mix(in srgb,var(--accent) 24%,var(--key-face));box-shadow:inset 0 0 0 1.5px var(--accent)}
.plate.hl-pair .key.paired{outline:1.5px dashed var(--accent);outline-offset:2px}
.key.lit{background:color-mix(in srgb,var(--led) 45%,var(--key-skirt));box-shadow:0 0 14px -5px var(--led)}
.key.lit .face{background:var(--led);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.key.lit .lg{color:var(--lg)}
.key.lit.sel{outline:2px solid var(--fg);outline-offset:1px}

.selbar{display:flex;align-items:center;gap:6px;height:34px;margin-top:4px;white-space:nowrap}
.scount{color:var(--accent);font-weight:600;margin-right:4px}
.scount.none{color:var(--fg)}
.snames{color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}

/* inspector */
.insp{flex:1;min-width:0;display:flex;flex-direction:column}
.selwrap{position:relative}
.select{width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;font-weight:600;text-align:left}
.select:hover{background:var(--raised)}
.select .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.select.open{background:var(--raised)}
.menu{position:absolute;left:0;right:0;top:36px;z-index:5;background:var(--popover);border:1px solid var(--line-strong);border-radius:9px;padding:4px;box-shadow:var(--shadow)}
.mi{display:flex;width:100%;height:28px;align-items:center;gap:8px;padding:0 8px;border:0;background:transparent;border-radius:6px;text-align:left}
.mi:hover{background:var(--hover)}
.mi .ck{width:14px;display:flex;color:var(--accent)}
.mi .cnt{margin-left:auto;color:var(--faint);font-size:12px}
.mi.on{font-weight:600}
.pair-row{display:flex;align-items:center;gap:6px;margin:8px -6px 4px;padding:6px;border-radius:8px}
.pair-row:hover{background:var(--raised)}
.mini{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px 3px;border-radius:6px;background:var(--key-face);box-shadow:inset 0 -3px 0 var(--key-skirt),0 0 0 1px var(--line);font-family:'Saira';font-weight:600;font-size:13px}
.plus{color:var(--faint);font-weight:600}
.flabel{color:var(--muted);font-size:12px;margin-bottom:4px}
.radio{display:flex;align-items:center;gap:9px;height:23px;padding:0 6px;margin:0 -6px;border-radius:6px;border:0;background:transparent;width:calc(100% + 12px);text-align:left;color:var(--muted)}
.radio:hover{background:var(--raised);color:var(--fg)}
.radio i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none}
.radio.on{color:var(--fg);font-weight:500}
.radio.on i{border:4px solid var(--accent)}
.irow{display:flex;align-items:center;gap:8px;min-height:32px}
.irow>span:first-child{flex:1;color:var(--fg)}
.empty-sm{color:var(--muted);font-size:12.5px;padding:16px 0 4px}

/* tools */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.kt{display:flex;gap:14px;align-items:flex-start}
.gauge{flex:none;display:block}
.gauge .gl{font-family:'Saira';font-weight:500;font-size:9.5px;fill:var(--faint)}
.gauge .acc{fill:var(--accent);font-weight:700;font-size:10.5px}
.kt-r{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-top:4px;min-width:0}
.kcap{display:inline-grid;place-items:center;min-width:46px;height:46px;padding:0 10px 5px;border-radius:8px;background:var(--key-face);box-shadow:inset 0 -5px 0 var(--key-skirt),0 0 0 1px var(--line);font-family:'Saira';font-weight:600;font-size:18px}
.big{display:flex;align-items:baseline;gap:4px}
.big b{font-family:'Saira';font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big span{font-family:'Saira';font-weight:500;font-size:14px;color:var(--muted)}
.state{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--raised);color:var(--muted);font-size:12px;font-weight:600}
.state.on{background:var(--accent-soft);color:var(--accent)}
.bigrow{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.bigrow .big{min-width:118px;justify-content:center}
.ruler{position:relative;height:20px;margin:3px 8px 0}
.ruler i{position:absolute;top:0;width:1px;height:4px;background:var(--tick)}
.ruler i.M{height:7px}
.ruler b{position:absolute;top:9px;transform:translateX(-50%);font-family:'Saira';font-weight:500;font-size:10px;color:var(--faint)}
.dz-l{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.dz-r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dz-r>span{color:var(--fg);font-size:12.5px}
.dz-r>span+.stp{margin-right:8px}
.srow2{display:flex;align-items:center;gap:8px;min-height:30px;margin-top:4px}
.srow2>span{flex:1}
.rtb.off{opacity:.45}
.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:178px;color:var(--muted);padding:0 12px}
.idle svg{color:var(--faint)}
.idle p{max-width:230px}

/* lighting */
.lrow{display:grid;grid-template-columns:1fr 352px;gap:16px;margin-top:14px}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px}
.fxb{height:28px;padding:0 8px;border:0;border-radius:6px;background:transparent;text-align:left;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.fxb:hover{background:var(--hover);color:var(--fg)}
.fxb .fxi{width:16px;display:flex;color:var(--muted);flex:none}
.fxb:hover .fxi{color:var(--fg)}
.fxb.on .fxi{color:var(--accent)}
.fxb.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.cp{display:flex;gap:14px}
.sv{position:relative;width:206px;height:122px;border-radius:8px;cursor:crosshair}
.sv .mk,.hue .mk{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.hue{position:relative;width:206px;height:10px;border-radius:6px;margin-top:10px;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.hue .mk{top:50%}
.sws{display:grid;grid-template-columns:repeat(3,24px);gap:7px;align-content:start}
.swb{width:24px;height:24px;border-radius:6px;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swb.on{outline:2px solid var(--fg);outline-offset:2px}
.hexrow{display:flex;align-items:center;gap:8px;margin-top:12px}
.hexsw{width:28px;height:28px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.hexin{height:28px;width:110px;border-radius:7px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);font:600 13px 'Saira';padding:0 9px;letter-spacing:.04em;text-transform:uppercase}
.cp-off{opacity:.4;pointer-events:none}
.lamp .srow2{margin-top:12px}
.lamp .srow2>.val{flex:none;font-family:'Saira';font-weight:600;font-variant-numeric:tabular-nums}

/* mouse */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--raised);border-radius:9px;padding:12px 12px 12px 14px;cursor:default}
.tile:hover{background:var(--hover)}
.tile.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.t-top{display:flex;align-items:center;height:20px;color:var(--muted);font-size:12.5px;font-weight:500}
.t-top .badge{margin-left:auto;color:var(--accent);font-weight:600;font-size:12px}
.t-main{display:flex;align-items:flex-end;margin-top:6px}
.t-main .big b{font-size:36px}
.t-step{margin-left:auto;display:flex;gap:4px}
.t-step .sbtn{background:var(--panel)}
.druler{position:relative;height:46px;margin:18px 10px 2px}
.dline{position:absolute;left:0;right:0;top:22px;height:2px;border-radius:2px;background:var(--raised)}
.dt{position:absolute;top:18px;width:1px;height:10px;background:var(--tick)}
.dl{position:absolute;top:32px;transform:translateX(-50%);font-family:'Saira';font-weight:500;font-size:10.5px;color:var(--faint)}
.dm{position:absolute;top:0;transform:translateX(-50%);height:16px;min-width:18px;padding:0 5px;border-radius:4px;background:var(--line-strong);font:600 10px/16px 'Saira';text-align:center;color:var(--fg)}
.dm::after{content:'';position:absolute;left:50%;top:16px;width:1.5px;height:7px;margin-left:-.75px;background:inherit}
.dm.on{background:var(--accent);color:var(--accent-ink)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.srow.first{border-top:0;padding-top:2px}
.stext{flex:1;min-width:0}
.sname{font-weight:600}
.sdesc{color:var(--muted);font-size:12.5px;margin-top:1px}

/* settings */
.narrow{max-width:640px;display:flex;flex-direction:column;gap:14px}
.accs{display:flex;gap:10px;flex:none}
.acc-sw{width:24px;height:24px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.acc-sw.on{outline:2px solid var(--fg);outline-offset:3px}
.ptitle-lg{font-family:'Saira';font-weight:600;font-size:26px;line-height:1.1;margin:0 0 4px}

/* dirty bar + toast */
.dirty{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 24px;background:var(--side);border-top:1px solid var(--line);white-space:nowrap}
.dirty[hidden],.toast[hidden]{display:none}
.ddot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dn{font-weight:600;margin-left:2px}
.da{color:var(--muted);margin-left:6px;overflow:hidden;text-overflow:ellipsis}
.dry{color:var(--muted);font-size:12px;background:var(--raised);height:24px;display:inline-flex;align-items:center;padding:0 9px;border-radius:999px;margin-right:6px}
.toast{position:absolute;top:14px;right:24px;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 12px;background:var(--popover);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);font-weight:500}
.toast svg{color:var(--accent)}

@media (prefers-reduced-motion: reduce){
  .win *{transition:none!important}
}
</style>
</head>

const win = $('#win');
const fmt = v => Number(v).toFixed(2);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r2 = v => Math.round(v * 100) / 100;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const SV = (vb, w, body, sw = 1.5) => `<svg viewBox="${vb}" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

}
function stepper(act, val, unit = 'mm', cls = '') {
  return `<div class="stp ${cls}"><button class="sbtn" data-act="${act}" data-d="-1" aria-label="Decrease">−</button><span class="snum"><span data-live="${act}">${val}</span>${unit ? `<small>${unit}</small>` : ''}</span><button class="sbtn" data-act="${act}" data-d="1" aria-label="Increase">+</button></div>`;

function isPending(id, lens) {
  if (lens === 'led') return S.led[id] !== base.led[id];
  return ['act', 'rt', 'press', 'lift'].some(m => S[m][id] !== base[m][id]);
}
const anyPending = lens => KEYS.some(x => isPending(x.id, lens));
function boardHTML(lens) {
  const sel = lens === 'trig' ? ui.sel : ui.ledSel;
  const bv = baseValue();
  let h = '';
  for (const x of KEYS) {
    const left = x.x * U, top = x.row * PITCH + (x.row ? FGAP : 0), w = x.w * U - 3;
    const cls = ['key']; if (sel.has(x.id)) cls.push('sel');
    let style = `left:${left}px;top:${top}px;width:${w}px`;
    let inner = '';
    if (lens === 'trig') {
      const a = S.act[x.id];
      const d = ui.tester.id === x.id ? ui.tester.depth : 0;
      inner += `<span class="depth" data-depth="${x.id}" style="height:${(d / 3.4 * 100).toFixed(1)}%"></span>`;
      inner += `<span class="lg">${esc(x.label)}</span>`;
      if (Math.abs(a - bv) > 0.001) { cls.push('diff'); inner += `<span class="val">${fmt(a)}</span>`; }
      inner += `<span class="bar"><i style="width:${(a / 3.4 * 100).toFixed(1)}%"></i></span>`;
      const paired = x.id === 'a' || x.id === 'd';
      if (paired) cls.push('paired');
      const pend = isPending(x.id, 'trig');
      if (pend) cls.push('pending');
      if (paired || S.rt[x.id]) inner += `<span class="tr">${paired ? `<span class="pair">${I.link}</span>` : ''}${S.rt[x.id] ? '<span class="rt"></span>' : ''}</span>`;
    } else {
      inner += `<span class="lg">${esc(x.label)}</span>`;
      const c = ledColor(x);
      if (c) { cls.push('lit'); style += `;--led:${c};--lg:${ink(c)}`; }
      if (isPending(x.id, 'led')) cls.push('pending');
    }
    const desc = lens === 'trig' ? `${x.label}, ${fmt(S.act[x.id])} millimetres${S.rt[x.id] ? ', Rapid Trigger on' : ''}` : x.label;
    h += `<button class="${cls.join(' ')}" data-key="${x.id}" data-lens="${lens}" style="${style}" aria-pressed="${sel.has(x.id)}" aria-label="${esc(desc)}"><span class="face">${inner}</span></button>`;
  }
  return h;
}

function gaugeSVG() {
  const id = ui.tester.id, d = ui.tester.depth, a = S.act[id];
  const H = 160, T = 8, X = 38, W = 22, y = v => T + v / 3.4 * H;
  let s = `<svg class="gauge" viewBox="0 0 100 176" width="100" height="176" aria-hidden="true"><defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--tick)" stroke-width="1.4"/></pattern>
    <filter id="glow" x="-30%" y="-400%" width="160%" height="900%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="trk"><rect x="${X}" y="${T}" width="${W}" height="${H}" rx="5"/></clipPath></defs>`;
  for (let i = 0; i <= 34; i++) {
    const yy = y(i / 10), major = i % 5 === 0;
    s += `<line x1="${major ? 22 : 27}" x2="32" y1="${yy}" y2="${yy}" style="stroke:var(--tick)" stroke-width="1"/>`;
    if (major) s += `<text x="18" y="${yy + 3.2}" text-anchor="end" class="gl">${(i / 10).toFixed(1)}</text>`;
  }
  s += `<rect x="${X}" y="${T}" width="${W}" height="${H}" rx="5" style="fill:var(--raised)"/>
    <g clip-path="url(#trk)">
      <rect x="${X}" y="${T}" width="${W}" height="${S.dzTop / 3.4 * H}" fill="url(#hatch)"/>
      <rect x="${X}" y="${y(3.4 - S.dzBot)}" width="${W}" height="${S.dzBot / 3.4 * H}" fill="url(#hatch)"/>
      <rect id="gFill" x="${X}" y="${T}" width="${W}" height="${d / 3.4 * H}" style="fill:var(--accent)" opacity=".28"/>
      <line id="gEdge" x1="${X}" x2="${X + W}" y1="${y(d)}" y2="${y(d)}" style="stroke:var(--fg)" stroke-width="1.5" opacity="${d > 0.005 ? .9 : 0}"/>
    </g>
    <line x1="${X - 7}" x2="${X + W + 7}" y1="${y(a)}" y2="${y(a)}" style="stroke:var(--accent)" stroke-width="6" opacity=".55" filter="url(#glow)"/>
    <line x1="${X - 7}" x2="${X + W + 7}" y1="${y(a)}" y2="${y(a)}" style="stroke:var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="${X + W + 11}" y="${y(a) + 3.6}" class="gl acc">${fmt(a)}</text></svg>`;
  return s;
}
function testerHTML() {

function dpiRuler() {
  const pos = v => Math.log2(v / 100) / Math.log2(320) * 100;
  const marks = [100, 200, 400, 800, 1600, 3200, 6400, 12800, 25600];
  let h = '<div class="druler" aria-hidden="true"><div class="dline"></div>';
  marks.forEach(m => { h += `<i class="dt" style="left:${pos(m)}%"></i><span class="dl" style="left:${pos(m)}%">${m >= 1000 ? (m / 1000) + 'K' : m}</span>`; });
  S.dpi.forEach((v, i) => { h += `<span class="dm ${i === S.dpiActive ? 'on' : ''}" style="left:${pos(clamp(v, 100, 32000))}%">${i + 1}</span>`; });
  return h + '</div>';
}

    <section class="panel"><div class="phead"><span class="ptitle">Appearance</span></div>
      <div class="srow first"><div class="stext"><div class="sname">Theme</div></div><div class="seg" role="radiogroup" aria-label="Theme">${['Light', 'Dark'].map(t => `<button class="${ui.theme === t.toLowerCase() ? 'on' : ''}" role="radio" aria-checked="${ui.theme === t.toLowerCase()}" data-act="setTheme" data-arg="${t.toLowerCase()}">${t}</button>`).join('')}</div></div>
      <div class="srow"><div class="stext"><div class="sname">Accent color</div><div class="sdesc">Used for selections, switches and Apply. Each color is tuned for both themes.</div></div>
        <div class="accs" role="radiogroup" aria-label="Accent color">${Object.entries(ACCENTS).map(([id, p]) => `<button class="acc-sw ${ui.accent === id ? 'on' : ''}" role="radio" aria-checked="${ui.accent === id}" aria-label="${p[0]}" title="${p[0]}" data-act="accent" data-arg="${id}" style="background:${ui.theme === 'dark' ? p[1] : p[3]}"></button>`).join('')}</div></div></section>
    <section class="panel"><div class="phead"><span class="ptitle">Updates</span></div>
      <div class="srow first"><div class="stext"><div class="sname">AgnoPeriph 0.1.0</div><div class="sdesc">Updates install from GitHub releases.</div></div><button class="btn outline" data-act="noop">Check for updates</button></div></section></div>`;
}
function gamesHTML() {
  return `<div class="narrow"><h1 class="ptitle-lg">Game profiles</h1>
    <section class="panel"><div class="idle" style="min-height:220px">${I.game.replace('width="16" height="16"', 'width="30" height="30"')}<p style="color:var(--fg);font-weight:600">No games yet</p><p>Add a game, then choose which preset each device uses while it runs.</p><button class="btn outline sm" data-act="noop">${I.plus}Add game…</button></div></section></div>`;
}

function mainHTML() {
  if (ui.view === 'settings') return settingsHTML();
  if (ui.view === 'games') return gamesHTML();
  const d = DEVICES.find(x => x.id === ui.device);
  if (d.id === 'rs7') return kbHTML(d);
  if (d.kind === 'mouse') return mouseHTML(d);
  return headHTML(d) + `<div class="panel ph" style="margin-top:20px"><p>${esc(d.name)} is not part of this mockup.<br>Open ATK RS7 RGB for the keyboard design.</p></div>`;
}
function dirtyHTML() {
  const n = labels.length, areas = [...new Set(labels)].join(', ');
  return `<span class="ddot"></span><span class="dn">${n} unsaved ${n === 1 ? 'change' : 'changes'}</span><span class="da">${esc(areas)}</span><span class="sp"></span>
    <span class="dry">Dry run: logged, not sent</span>
    <button class="btn ghost sm" data-act="undo">${I.undo}Undo</button><button class="btn outline sm" data-act="discard">Discard</button><button class="btn primary sm" data-act="apply">Apply</button>`;
}

/* ---------- rendering ---------- */
function focusSel(el) {
  if (!el || !el.dataset || !win.contains(el)) return null;
  const ds = el.dataset;
  if (ds.key) return `[data-key="${ds.key}"][data-lens="${ds.lens}"]`;
  if (ds.slide) return `[data-slide="${ds.slide}"]`;
  if (ds.act) return `[data-act="${ds.act}"]` + (ds.arg ? `[data-arg="${CSS.escape(ds.arg)}"]` : '') + (ds.d ? `[data-d="${ds.d}"]` : '') + (ds.i ? `[data-i="${ds.i}"]` : '');
  return null;
}
function renderDirty() {
  const d = $('#dirty');
  d.innerHTML = dirtyHTML(); d.hidden = !labels.length;
}
function renderAll() {
  const fs = focusSel(document.activeElement);
  const main = $('#main'), top = main.scrollTop;
  win.dataset.theme = ui.theme;
  applyAccent();
  $('#themeBtn').innerHTML = ui.theme === 'dark' ? I.sun : I.moon;
  $('#devCount').textContent = DEVICES.length + ' devices';
  $('#side').innerHTML = sideHTML();
  main.innerHTML = mainHTML();
  main.scrollTop = top;
  renderDirty();
  if (fs) { const n = win.querySelector(fs); if (n) n.focus({ preventScroll: true }); }
}
function renderTester() {
  const p = $('#ktPanel'); if (p) p.outerHTML = testerHTML();
}
function updateTesterDOM() {
  const { id, depth } = ui.tester, a = S.act[id], H = 160, T = 8;
  const fill = $('#gFill'), edge = $('#gEdge');
  if (fill) fill.setAttribute('height', depth / 3.4 * H);
  if (edge) { const yy = T + depth / 3.4 * H; edge.setAttribute('y1', yy); edge.setAttribute('y2', yy); edge.setAttribute('opacity', depth > 0.005 ? .9 : 0); }
  const dEl = $('#ktDepth'); if (dEl) dEl.textContent = fmt(depth);
  const st = $('#ktState'); if (st) { const on = depth >= a; st.textContent = on ? 'Pressed' : 'Released'; st.classList.toggle('on', on); }
  const kd = win.querySelector(`[data-depth="${id}"]`); if (kd) kd.style.height = (depth / 3.4 * 100).toFixed(1) + '%';
}
let raf = 0;
function tween(target, ms) {
  cancelAnimationFrame(raf);
  const from = ui.tester.depth, t0 = performance.now();
  if (reduced) { ui.tester.depth = target; updateTesterDOM(); return; }
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
    ui.tester.depth = from + (target - from) * e;
    updateTesterDOM();
    if (t < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* ---------- events ---------- */
win.addEventListener('click', e => {
  const keyEl = e.target.closest('[data-key]');
  if (keyEl) {
    const set = keyEl.dataset.lens === 'trig' ? ui.sel : ui.ledSel, id = keyEl.dataset.key;
    set.has(id) ? set.delete(id) : set.add(id);
    renderAll(); return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) { if (ui.menu) { ui.menu = false; renderAll(); } return; }
  const act = el.dataset.act, arg = el.dataset.arg, dd = parseFloat(el.dataset.d || 0), idx = parseInt(el.dataset.i || 0);
  if (act !== 'menu' && act !== 'ptype' && ui.menu) ui.menu = false;
  switch (act) {
    case 'noop': renderAll(); break;
    case 'theme': ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; renderAll(); break;
    case 'setTheme': ui.theme = arg; renderAll(); break;
    case 'accent': ui.accent = arg; renderAll(); break;
    case 'dev': ui.view = 'device'; ui.device = arg; renderAll(); break;
    case 'nav': ui.view = arg; renderAll(); break;
    case 'preset': ui.preset = arg; renderAll(); break;
    case 'profile': ui.profile = parseInt(arg.split(' ')[1]); renderAll(); break;
    case 'kbtab': ui.kbTab = arg; renderAll(); break;
    case 'mstab': ui.msTab = arg; renderAll(); break;
    case 'selall': (arg === 'trig' ? ui.sel : ui.ledSel).clear(); KEYS.forEach(x => (arg === 'trig' ? ui.sel : ui.ledSel).add(x.id)); renderAll(); break;
    case 'invert': { const n = new Set(KEYS.map(x => x.id).filter(id => !ui.sel.has(id))); ui.sel = n; renderAll(); break; }
    case 'clear': (arg === 'trig' ? ui.sel : ui.ledSel).clear(); renderAll(); break;
    case 'restore': commit('Restore default', () => ui.sel.forEach(id => { S.act[id] = 1.2; S.rt[id] = false; S.press[id] = .15; S.lift[id] = .15; })); break;
    case 'act': commit('Actuation', () => { const { v } = selVals(S.act); const nv = clamp(r2(v + dd * .02), .1, 3.4); ui.sel.forEach(id => S.act[id] = nv); }); break;
    case 'useall': commit('Actuation', () => { const { v } = selVals(S.act); KEYS.forEach(x => S.act[x.id] = v); }); break;
    case 'dzTop': commit('Dead zones', () => S.dzTop = clamp(r2(S.dzTop + dd * .02), 0, 1)); break;
    case 'dzBot': commit('Dead zones', () => S.dzBot = clamp(r2(S.dzBot + dd * .02), 0, 1)); break;
    case 'rt': commit('Rapid Trigger', () => { const on = [...ui.sel].every(id => S.rt[id]); ui.sel.forEach(id => S.rt[id] = !on); }); break;
    case 'press': case 'lift': commit('Rapid Trigger', () => { const m = S[act]; const { v } = selVals(m); const nv = clamp(r2(v + dd * .01), .02, 1); ui.sel.forEach(id => m[id] = nv); }); break;
    case 'menu': ui.menu = !ui.menu; renderAll(); break;
    case 'ptype': ui.pairType = arg; ui.menu = false; renderAll(); break;
    case 'socd': commit('SOCD', () => S.socdMode = arg); break;
    case 'socdAct': commit('SOCD', () => S.socdAct = clamp(r2(S.socdAct + dd * .02), .1, 3.4)); break;
    case 'socdRt': commit('SOCD', () => S.socdRt = !S.socdRt); break;
    case 'zone': ui.zone = arg; renderAll(); break;
    case 'effect': commit('Lighting', () => S.effect = arg); break;
    case 'swatch': applyColor(arg); break;
    case 'dpiActive': commit('DPI', () => S.dpiActive = idx); break;
    case 'dpi': commit('DPI', () => S.dpi[idx] = clamp(S.dpi[idx] + dd * 50, 50, 32000)); break;
    case 'poll': commit('Polling rate', () => S.poll = arg); break;
    case 'lod': commit('Lift-off distance', () => S.lod = arg); break;
    case 'debounce': commit('Click debounce', () => S.debounce = clamp(S.debounce + dd, 0, 20)); break;
    case 'msync': case 'angle': case 'ripple': commit('Sensor', () => S[act] = !S[act]); break;
    case 'tray': case 'startup': case 'battAlerts': ui[act] = !ui[act]; renderAll(); break;
    case 'undo': if (hist.length) { S = hist.pop(); labels.pop(); } renderAll(); break;
    case 'discard': S = clone(base); hist = []; labels = []; renderAll(); break;
    case 'apply': {
      base = clone(S); hist = []; labels = []; renderAll();
      const d = DEVICES.find(x => x.id === ui.device);
      toast(`Applied to ${d.name}`); break;
    }
  }
});
win.addEventListener('keydown', e => {
  const t = e.target.closest('.tile');
  if (t && (e.key === 'Enter' || e.key === ' ') && e.target === t) { e.preventDefault(); t.click(); }
  if (e.key === 'Escape' && ui.menu) { ui.menu = false; renderAll(); const s = win.querySelector('[data-act="menu"]'); s && s.focus(); }
});
win.addEventListener('mouseover', e => { if (e.target.closest('[data-hover="pair"]')) $('#plateTrig')?.classList.add('hl-pair'); });
win.addEventListener('mouseout', e => { if (e.target.closest('[data-hover="pair"]')) $('#plateTrig')?.classList.remove('hl-pair'); });

const SLIDE_LABEL = { act: 'Actuation', press: 'Rapid Trigger', lift: 'Rapid Trigger', bright: 'Lighting', speed: 'Lighting' };
win.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'hexIn') { if (/^#[0-9a-f]{6}$/i.test(t.value)) applyColor(t.value.toLowerCase(), true); return; }
  const kind = t.dataset.slide; if (!kind) return;
  if (!dragging) { hist.push(clone(S)); labels.push(SLIDE_LABEL[kind]); dragging = true; renderDirty(); }
  const v = parseFloat(t.value);
  const live = (k2, txt) => win.querySelectorAll(`[data-live="${k2}"]`).forEach(n => n.textContent = txt);
  if (kind === 'act') {
    ui.sel.forEach(id => S.act[id] = v);
    t.style.setProperty('--p', ((v - .1) / 3.3 * 100) + '%'); live('act', fmt(v));
    $('#plateTrig').innerHTML = boardHTML('trig');
    if (ui.sel.has(ui.tester.id)) { renderTester(); }
  } else if (kind === 'press' || kind === 'lift') {
    ui.sel.forEach(id => S[kind][id] = v);
    t.style.setProperty('--p', ((v - .02) / .98 * 100) + '%'); live(kind, fmt(v));
  } else {
    S[kind] = v; t.style.setProperty('--p', v + '%'); live(kind, v + '%');
    if (kind === 'bright') $('#plateLed').innerHTML = boardHTML('led');
  }
});
win.addEventListener('change', e => { if (e.target.dataset.slide) { dragging = false; renderAll(); } });

function applyColor(c, keepInput) {
  if (!COLORABLE.has(S.effect)) return;
  if (S.effect === 'Customization') {
    if (!ui.ledSel.size) { S.color = c; renderAll(); return; }
    commit('Lighting', () => { ui.ledSel.forEach(id => S.led[id] = c); S.color = c; });
  } else commit('Lighting', () => S.color = c);
  if (keepInput) { const h = $('#hexIn'); if (h) { h.focus(); h.setSelectionRange(7, 7); } }
}
function pickAt(e, kind) {
  const r = e.currentTarget.getBoundingClientRect();
  const x = clamp((e.clientX - r.left) / r.width, 0, 1), y = clamp((e.clientY - r.top) / r.height, 0, 1);
  const hsv = hex2hsv(currentColor());
  if (kind === 'sv') applyColor(hsv2hex(hsv.h, x, 1 - y));
  else applyColor(hsv2hex(x * 359.9, Math.max(hsv.s, .6), Math.max(hsv.v, .8)));
}
win.addEventListener('pointerdown', e => {
  const sv = e.target.closest('#svBox'), hue = e.target.closest('#hueBar');
  if (sv) pickAt({ currentTarget: sv, clientX: e.clientX, clientY: e.clientY }, 'sv');
  if (hue) pickAt({ currentTarget: hue, clientX: e.clientX, clientY: e.clientY }, 'hue');
});

function toast(msg) {
  const t = $('#toast');
  t.innerHTML = I.checkL + esc(msg); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200);
}

/* live key tester: physical key presses drive the gauge */
const testerLive = () => ui.view === 'device' && ui.device === 'rs7' && ui.kbTab === 'triggers';
document.addEventListener('keydown', e => {
  if (e.repeat || !testerLive() || e.target.closest('input')) return;
  const id = codeToId(e.code); if (!id) return;
  if (id !== ui.tester.id) {
    const old = win.querySelector(`[data-depth="${ui.tester.id}"]`); if (old) old.style.height = '0%';
    ui.tester.id = id; ui.tester.depth = 0; renderTester();
  }
  tween(3.2 + Math.random() * 0.18, 110);
});
document.addEventListener('keyup', e => {
  if (!testerLive()) return;
  if (codeToId(e.code) === ui.tester.id) tween(0, 160);
});

/* ---------- fit the 1240×820 window into whatever width hosts it ---------- */
function fit() {
  const st = $('#stage'), w = st.clientWidth, s = Math.min(1, w / 1240);
  win.style.transform = `scale(${s})`;
  win.style.left = Math.max(0, (w - 1240 * s) / 2) + 'px';
  st.style.height = Math.ceil(820 * s) + 'px';
}
new ResizeObserver(fit).observe($('#stage'));

/* initial state from the URL hash, e.g. #lighting-light or #triggers-empty-dark */
document.querySelectorAll('[data-icon]').forEach(n => n.outerHTML = I[n.dataset.icon]);
const flags = location.hash.slice(1).split(/[-,&]/);
if (flags.includes('light')) ui.theme = 'light';
if (flags.includes('lighting')) { ui.kbTab = 'lighting'; ui.ledSel = new Set(['w', 'a', 's', 'd']); }
if (flags.includes('mouse')) ui.device = 'x2';
if (flags.includes('settings')) ui.view = 'settings';
if (flags.includes('games')) ui.view = 'games';
if (flags.includes('empty')) ui.sel.clear();
Object.keys(ACCENTS).forEach(id => { if (flags.includes(id)) ui.accent = id; });
if (flags.includes('dirty')) { hist.push(clone(S)); labels.push('Rapid Trigger'); S.press.w = S.press.a = S.press.s = S.press.d = 0.1; S.lift.w = S.lift.a = S.lift.s = S.lift.d = 0.1; }
if (flags.includes('shot')) win.classList.add('shot');
renderAll(); fit();
</script>
</body>
</html>
